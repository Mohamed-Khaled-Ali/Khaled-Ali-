<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقتي الشخصية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      object-fit: cover;
      margin-bottom: 15px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 5px; color: #fff; }
    p.title { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
    
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
    
    /* ألوان مميزة لبعض الأزرار */
    .btn.whatsapp { background: #25D366; color: #fff; border: none; }
    .btn.call { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; }
    .btn.linkedin { background: #0077b5; border: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- صورتك الشخصية -->
    <img src="avatar.jpg" class="avatar" alt="My photo">
    
    <!-- اسمك والمسمى الوظيفي -->
    <h1>اسمك هنا</h1>
    <p class="title">المسمى الوظيفي أو التخصص</p>

    <!-- الروابط -->
    <div class="links">
      <!-- زر الاتصال المباشر -->
      <a href="tel:+201000000000" class="btn call">
        <i class="fa-solid fa-phone"></i> اتصل بي مباشرة
      </a>

      <!-- زر واتساب يفتح محادثة مباشرة -->
      <a href="https://wa.me/201000000000" target="_blank" class="btn whatsapp">
        <i class="fa-brands fa-whatsapp"></i> راسلني على واتساب
      </a>

      <!-- لينكد إن -->
      <a href="https://linkedin.com/in/yourprofile" target="_blank" class="btn linkedin">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>

      <!-- بريد إلكتروني -->
      <a href="mailto:your-email@example.com" class="btn">
        <i class="fa-solid fa-envelope"></i> البريد الإلكتروني
      </a>

      <!-- رابط موقعك الرئيسي -->
      <a href="https://yourdomain.com" target="_blank" class="btn">
        <i class="fa-solid fa-globe"></i> زيارة موقعي
      </a>
    </div>
  </div>

</body>
</html>
