<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خالد على عبد الدايم - خدمات النقل الثقيل</title>
  
  <!-- أيقونات FontAwesome للأزرار -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0b1329 0%, #1c2a4a 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 35px 24px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 18px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3.5px solid #f59e0b; /* لون ذهبي/برتقالي أنيق يناسب هوية النقل */
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
    }

    .name-ar {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .name-en {
      font-size: 1.05rem;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      direction: ltr;
    }

    .subtitle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: all 0.25s ease;
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* زر الاتصال المباشر */
    .btn.call {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
    }

    /* زر الواتساب */
    .btn.whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
    }

    /* زر فيسبوك */
    .btn.facebook {
      background: linear-gradient(135deg, #1877f2, #0d5bb5);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(24, 119, 242, 0.35);
    }

    .btn i {
      font-size: 1.25rem;
    }

    /* جملة ختامية بالأسفل */
    .footer-note {
      font-size: 0.92rem;
      color: #f59e0b;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      border: 1px dashed rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- الصورة الشخصية -->
    <div class="avatar-wrapper">
      <img src="avatar.jpg" alt="خالد على عبد الدايم" class="avatar">
    </div>
    
    <!-- الاسم عربي وإنجليزي -->
    <h1 class="name-ar">خالد على عبد الدايم</h1>
    <p class="name-en">Khaled Ali Abdeldaym</p>

    <!-- الكلمة الفرعية -->
    <p class="subtitle">
      🚚 بنقدم خدمات النقل الثقيل بكافه انواعه فى اى مكان بدولة الكويت
    </p>

    <!-- الكروت والأزرار التفاعلية -->
    <div class="links">
      <!-- 1. اتصل بي مباشرة (كود الكويت +965 تلقائي للمكالمة) -->
      <a href="tel:+96560351030" class="btn call">
        <i class="fa-solid fa-phone-volume"></i>
        <span>اتصل بى مباشرة</span>
      </a>

      <!-- 2. راسلني على الواتساب -->
      <a href="https://wa.me/96560351030" target="_blank" class="btn whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>راسلنى على الواتساب</span>
      </a>

      <!-- 3. كارت فيسبوك -->
      <a href="https://www.facebook.com/khaled.eldaym.2025" target="_blank" class="btn facebook">
        <i class="fa-brands fa-facebook-f"></i>
        <span>Facebook</span>
      </a>
    </div>

    <!-- النص الختامي -->
    <div class="footer-note">
      <i class="fa-solid fa-star"></i>
      <span>لدينا افضل اسعار واسرع خدمة</span>
      <i class="fa-solid fa-star"></i>
    </div>
  </div>

</body>
  
</html>
